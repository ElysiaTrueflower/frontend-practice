<head>
  <meta charset="UTF-8">
  <title>任务2 图表联动</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>#bar-chart{height:350px} #line-chart{height:350px}</style>
</head>
<body class="p-4">
  <h2>图表联动：点击柱状图，折线图过滤</h2>
  <div class="row">
    <div class="col-md-6"><div id="bar-chart"></div></div>
    <div class="col-md-6"><canvas id="line-chart"></canvas></div>
  </div>
  <div id="tip" class="alert alert-info mt-2">点击左侧柱状图的系列，右侧折线图高亮对应校门数据</div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <script src="test2.js"></script>
</body>
