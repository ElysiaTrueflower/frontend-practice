<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>迷你校园信息中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .title-block {
            margin: 2rem 0 1rem;
            border-left: 4px solid #0d6efd;
            padding-left: 0.8rem;
        }
        #threeContainer {
            width: 100%;
            height: 520px;
            border: 1px solid #dee2e6;
            background-color: #16213e;
            position: relative;
        }
        #musicWrap { position: absolute; top: 12px; right: 12px; z-index: 9999; }
        canvas { display: block; }
        .chart-height { height: 340px; }
        .contact-card {
            border: 1px solid #adb5bd;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            border-radius: 0.4rem;
        }
        .food-card img { aspect-ratio: 16/10; object-fit: cover; }
        .page-spin-btn {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 99999;
        }
        body {
            overflow-x: hidden;
        }
        #perspectiveWrap {
            perspective: 1200px;
            perspective-origin: 50% 50%;
        }
        #pageWrap {
            transform-origin: 50% 50%; 
            transform-style: preserve-3d;
            will-change: transform;
        }
        #pageWrap.spinning {
            animation: pageSpin3D 8s linear infinite;
        }

        @keyframes pageSpin3D {
            from { transform: rotateX(15deg) rotateY(0deg); }
            to { transform: rotateX(15deg) rotateY(360deg); }
        }
    </style>
    
</head>

<body>
    <button id="pageSpinBtn" class="btn btn-warning btn-sm page-spin-btn">整页旋转</button>
<div id="perspectiveWrap">
    <div id="pageWrap">

    <div class="container mt-4">
    <header class="mb-5">
        <h1>迷你校园信息中心</h1>
        <div class="gap-2 d-flex flex-wrap">
            <a href="#sec-contact" class="btn btn-outline-primary btn-sm">联系人管理</a>
            <a href="#sec-data" class="btn btn-outline-primary btn-sm">数据可视化看板</a>
            <a href="#sec-3d" class="btn btn-outline-primary btn-sm">3D展示台</a>
            <a href="#sec-food" class="btn btn-outline-primary btn-sm">美食导航</a>
            <a href="https://hcdek.kanamitv.cloud/" class="btn btn-outline-primary btn-sm" target="_blank">奇妙小游戏</a>
        </div>
    </header>

    <section id="sec-contact">
        <h2 class="title-block">校园联系人登记</h2>
        <div class="row">
            <div class="col-md-5">
                <form id="addForm">
                    <div class="mb-3">
                        <label class="form-label">君の姓名</label>
                        <input class="form-control" id="inpName" placeholder="输入姓名" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">联系电话</label>
                        <input class="form-control" id="inpPhone" placeholder="输入号码" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">给他备注</label>
                        <input class="form-control" id="inpNote" placeholder="输入备注">
                    </div>
                    <button type="submit" class="btn btn-primary">添加联系人</button>
                </form>
                <div class="text-danger small mt-2" id="tipMsg"></div>
            </div>
            <div class="col-md-7">
                <h5>联系人列表</h5>
                <div id="contactBox"></div>
            </div>
        </div>
    </section>


    <section id="sec-data">
        <h2 class="title-block">校门出入数据看板</h2>
        <p class="text-muted">模拟周一至周五各校门人员出入统计</p>
        <p id="status" class="alert alert-warning d-none"></p>
        <p class="text-muted" id="sub-title">数据来源：</p>
        <section class="row g-3 mb-4" id="cards"></section>
        <div class="row g-3">
            <div class="col-lg-6">
                <h5>各校门每日出入人次（柱状图）</h5>
                <div id="barChartDom" class="chart-height border rounded"></div>
            </div>
            <div class="col-lg-6">
                <h5>出入趋势（折线图）</h5>
                <div class="chart-height border rounded">
                    <canvas id="lineChartDom"></canvas>
                </div>
            </div>
        </div>
    </section>



    <section id="sec-3d">
        <h2 class="title-block">3D校园(bushi)展品旋转展示台</h2>
        <p class="text-muted"> 操作说明：鼠标拖拽旋转视角、滚轮缩放；点击按钮控制背景音乐</p>
        <div id="threeContainer">
            <div id="musicWrap">
                <button id="musicBtn" class="btn btn-dark btn-sm">播放音乐</button>
            </div>
            <audio id="bgAudio" src="audio/bgm.mp3" loop preload="auto" crossorigin="anonymous">
        </div>
        <br>
    </section>


    <section id="sec-food">
        <br>
        <br>
        <h2 class="title-block">校园美食导航</h2>

        <h5 class="text-center my-4">普通美食</h5>
        <div class="row g-3">
            <div class="col-md-6 col-lg-4">
                <div class="card food-card h-100">
                    <a href="https://www.bilibili.com/video/BV1uHu76sEh8/" target="_blank">
                        <img src="image/common1.png" class="card-img-top" alt="普通美食①">
                    </a>
                    <div class="card-body"><h6 class="card-title">大学生能飞</h6></div>
                </div>
            </div>
            <div class="col-md-6 col-lg-4">
                <div class="card food-card h-100">
                    <a href="https://www.bilibili.com/video/BV1TBMM6ZE4t/" target="_blank">
                        <img src="image/common2.png" class="card-img-top" alt="普通美食②">
                    </a>
                    <div class="card-body"><h6 class="card-title">Bark</h6></div>
                </div>
            </div>
            <div class="col-md-6 col-lg-4">
                <div class="card food-card h-100">
                    <a href="https://www.bilibili.com/video/BV1YiodBsEYe/" target="_blank">
                        <img src="image/common3.png" class="card-img-top" alt="普通美食③">
                    </a>
                    <div class="card-body"><h6 class="card-title">Ring</h6></div>
                </div>
            </div>
        </div>

        <h5 class="text-center my-4">更好的美食</h5>
        <div class="row g-3">
            <div class="col-md-6 col-lg-4">
                <div class="card food-card h-100">
                    <a href="https://www.bilibili.com/video/BV13okTB2ERd/" target="_blank">
                        <img src="image/better1.png" class="card-img-top" alt="更好的美食①">
                    </a>
                    <div class="card-body"><h6 class="card-title">急急急</h6></div>
                </div>
            </div>
            <div class="col-md-6 col-lg-4">
                <div class="card food-card h-100">
                    <a href="https://www.bilibili.com/video/BV1jo6gBxEM3/" target="_blank">
                        <img src="image/better2.png" class="card-img-top" alt="更好的美食②">
                    </a>
                    <div class="card-body"><h6 class="card-title">糖糖？！</h6></div>
                </div>
            </div>
            <div class="col-md-6 col-lg-4">
                <div class="card food-card h-100">
                    <a href="https://www.bilibili.com/video/BV1QJr5BcE7S/" target="_blank">
                        <img src="image/better3.png" class="card-img-top" alt="更好的美食③">
                    </a>
                    <div class="card-body"><h6 class="card-title">石！？</h6></div>
                </div>
            </div>
        </div>

        <h5 class="text-center my-4">极品</h5>
        <div class="row g-3">
            <div class="col-md-6 col-lg-4">
                <div class="card food-card h-100">
                    <a href="https://www.bilibili.com/video/BV1rgGc6BEr2/" target="_blank">
                        <img src="image/ultimate1.png" class="card-img-top" alt="极品①">
                    </a>
                    <div class="card-body"><h6 class="card-title">自己品</h6></div>
                </div>
            </div>
            <div class="col-md-6 col-lg-4">
                <div class="card food-card h-100">
                    <a href="https://www.bilibili.com/video/BV1KmDZBPEu7/" target="_blank">
                        <img src="image/ultimate2.png" class="card-img-top" alt="极品②">
                    </a>
                    <div class="card-body"><h6 class="card-title">自己品</h6></div>
                </div>
            </div>
            <div class="col-md-6 col-lg-4">
                <div class="card food-card h-100">
                    <a href="https://www.bilibili.com/video/BV17qJs6XERk/" target="_blank">
                        <img src="image/ultimate3.png" class="card-img-top" alt="极品③">
                    </a>
                    <div class="card-body"><h6 class="card-title">自己品</h6></div>
                </div>
            </div>
        </div>
    </section>
    </div>
    <footer class="text-center mt-4">
    MadeBy<a href="image/haqi.jpg" target="_blank">@Starbear</a>
    </footer>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>

<script src="contact.js"></script>
<script src="chart.js"></script>
<script src="theme.js"></script>

<script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js",

</body>
</html>
