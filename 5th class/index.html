<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <title>联系人</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: sans-serif;
            max-width: 480px;
            margin: 24px auto;
            padding: 0 16px;
        }
        .form-item { margin: 8px 0; }
        input {
            width: 100%;
            padding: 8px;
            font-size:16px;
        }
        button {
            padding:6px 12px;
            cursor:pointer;
        }
        .tip {
            color: #c00;
            min-height:20px;
            font-size:14px;
        }
        .contact-item {
            border:1px solid #999;
            padding:10px;
            margin:8px 0;
            border-radius:6px;
        }
        .btn-group button {
            margin-right:8px;
        }
    </style>
</head>
<body>
    <h1>联系人</h1>
    <form id="addForm">
        <div class="form-item">
            <label for="name">名字：</label>
            <input type="text" id="nameInput" placeholder="姓名" required>
        </div>
        <div class="form-item">
            <label for="phone">电话：</label>
            <input type="text" id="phoneInput" placeholder="电话" required>
        </div>
        <div class="form-item">
            <label for="note">备注：</label>
            <input type="text" id="noteInput" placeholder="备注">
        </div>
        <button type="submit">添加联系人</button>
    </form>
    <p class="tip" id="tip"></p>
    <h3>联系人列表</h3>
    <div id="contactList"></div>

    <script src="script/script.js"></script>
</body>
</html>
