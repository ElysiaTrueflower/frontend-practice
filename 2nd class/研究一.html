<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>表单研究任务</title>
    <link rel="stylesheet" href="css/研究一.css">
</head>
<body>
    <main>
        <details>
            <summary>填写说明</summary>
            <p>带*为必填项，邮箱需要符合邮箱格式，请认真填写表单内容。</p>
        </details>

        <fieldset>
            <legend>用户信息表单</legend>
            <label>姓名*：</label>
            <input type="text" required>

            <label>邮箱*：</label>
            <input type="email" required>

            <label>手机号：</label>
            <input type="tel">

            <button type="submit">提交</button>
        </fieldset>
    </main>
</body>
</html>
